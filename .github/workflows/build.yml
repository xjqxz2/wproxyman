# ============================================================================
# WProxyman — build & release pipeline（全平台矩阵）
#
# 产物命名：WProxyman_<os>_<arch>.<ext>
#   - Windows amd64/arm64        → .exe（arm64 在 amd64 runner 交叉编译）
#   - macOS Apple Silicon (arm64) → .dmg（hdiutil，系统自带）
#   - Linux amd64/arm64           → .AppImage（appimagetool 手动打包）
#
# 每次 push 到 main：
#   1. 四个原生 Runner 并行构建；
#   2. publish 任务把全部产物自动发布到 Releases 页面的 "Latest build"；
# 打 tag（v*）：额外发布正式 Release。
# ============================================================================

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Release / tag 操作需要写权限。
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows：amd64 本机构建 + arm64 交叉编译（无需 CGO）---
          - os: windows-latest
            platform: windows/amd64
            artifact: wproxyman-windows-amd64
            asset: WProxyman_windows_amd64.exe
            isWindows: "true"

          # --- macOS：GitHub 已下线 Intel runner，云上仅 Apple Silicon ---
          - os: macos-14
            platform: darwin/arm64
            artifact: wproxyman-macos-arm64
            asset: WProxyman_darwin_arm64.dmg
            isWindows: "false"

          # --- Linux：amd64（x64 runner）---
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: wproxyman-linux-amd64
            asset: WProxyman_linux_amd64.AppImage
            isWindows: "false"

          # --- Linux：arm64（GitHub ARM runner）---
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: wproxyman-linux-arm64
            asset: WProxyman_linux_arm64.AppImage
            isWindows: "false"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # --- Windows：依次构建 amd64 与 arm64，并按平台命名 ---
      - name: Build Windows (amd64)
        if: matrix.isWindows == 'true'
        shell: pwsh
        run: |
          wails build -platform windows/amd64
          Move-Item build/bin/WProxyman.exe WProxyman_windows_amd64.exe -Force

      - name: Build Windows (arm64, cross-compiled)
        if: matrix.isWindows == 'true'
        shell: pwsh
        run: |
          Remove-Item build/bin/WProxyman.exe -ErrorAction SilentlyContinue
          wails build -platform windows/arm64
          Move-Item build/bin/WProxyman.exe WProxyman_windows_arm64.exe -Force

      # --- macOS：构建 .app 后用 hdiutil 打成 dmg ---
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          wails build -platform darwin/arm64
          hdiutil create \
            -volname WProxyman \
            -srcfolder build/bin/WProxyman.app \
            -ov -format UDZO \
            WProxyman_darwin_arm64.dmg

      # --- Linux：构建二进制后手动打包为 AppImage ---
      - name: Build Linux
        if: runner.os == 'Linux'
        run: wails build -platform ${{ matrix.platform }}

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          BIN_NAME="wproxyman"
          # 组装 AppDir 结构（.desktop + 图标 + 可执行文件）
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/WProxyman AppDir/usr/bin/${BIN_NAME}
          cp build/appicon.png AppDir/usr/share/icons/hicolor/256x256/apps/${BIN_NAME}.png
          cat > AppDir/usr/share/applications/${BIN_NAME}.desktop <<EOF
          [Desktop Entry]
          Name=WProxyman
          Comment=HTTP/HTTPS debugging proxy
          Exec=${BIN_NAME}
          Icon=${BIN_NAME}
          Terminal=false
          Type=Application
          Categories=Development;Utility;
          EOF
          # 下载 appimagetool（按架构），无 FUSE 环境用 --appimage-extract 运行
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            URL="https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage"
          else
            URL="https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          fi
          curl -sL "$URL" -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          ./squashfs-root/AppRun AppDir "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.asset }}
          if-no-files-found: error

      # 打 tag（v*）时：构建产物同时直接发布为正式 Release。
      - name: Attach binaries to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}

  # ---------------------------------------------------------------------------
  # 自动发布：push 到 main 构建成功后，把全平台产物发布到 Releases 页面的
  # "Latest build"（预发布）。每次构建覆盖更新，无需手动打 tag。
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 全部产物都是单文件（exe/dmg/AppImage），直接收拢到一个目录。
      - name: Assemble release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      # 删除上一次的 "continuous" Release 与 tag，实现覆盖更新。
      - name: Clean up previous continuous release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = 'continuous';
            try {
              const rels = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
              for (const r of rels.data) {
                if (r.tag_name === tag) {
                  await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
                }
              }
            } catch (e) { console.log('clean release:', e.message); }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) { console.log('clean tag:', e.message); }

      # 发布最新的自动构建产物到 Releases 页面。
      - name: Publish to Releases (auto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Latest build
          body: |
            自动构建产物（main 分支最新提交，全平台）

            - Commit: `${{ github.sha }}`
            - 构建时间: ${{ github.event.head_commit.timestamp }}

            | 平台 | 架构 | 产物 |
            |---|---|---|
            | Windows | x64 | WProxyman_windows_amd64.exe |
            | Windows | ARM64 | WProxyman_windows_arm64.exe |
            | macOS | Apple Silicon | WProxyman_darwin_arm64.dmg |
            | Linux | x64 | WProxyman_linux_amd64.AppImage |
            | Linux | ARM64 | WProxyman_linux_arm64.AppImage |

            > 正式版本请打 tag 发布：`git tag v1.0.0 && git push origin v1.0.0`
          files: release/*
          prerelease: true
