# ============================================================================
# WProxyman — build & release pipeline（全平台矩阵）
#
# 产物命名：
#   - Windows amd64/arm64  → WProxyman_windows_*.exe（arm64 在 amd64 runner 交叉编译）
#   - macOS arm64 / amd64  → WProxyman_darwin_*.dmg（hdiutil，系统自带）
#   - Linux amd64          → wproxyman_<ver>_linux_amd64.tar.gz / .deb / .rpm 三件套
#                          （Wails v2 不内置 Linux 打包；AppImage 依赖 FUSE，
#                           改为覆盖全发行版的三格式）
#
# 每次 push 到 main：
#   1. 各原生 Runner 并行构建；
#   2. publish 任务把全部产物自动发布到 Releases 页面的 "Latest build"；
# 打 tag（v*）：额外发布正式 Release。
#
# Runner 说明（2026-08 现状）：
#   - macOS 统一用 macos-26 镜像：macos-14 已进入弃用期（2026-11-02 下线）。
#   - Intel (x64) macOS 用 macos-26-intel（免费标准 runner）；
#     macos-14/15 的 Intel large runner 需 Team/Enterprise 付费计划。

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Release / tag 操作需要写权限。
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows：amd64 本机构建 + arm64 交叉编译（无需 CGO）---
          - os: windows-latest
            platform: windows/amd64
            artifact: wproxyman-windows-amd64
            asset: WProxyman_windows_amd64.exe
            isWindows: "true"

          # --- macOS arm64（Apple Silicon）：macos-26 镜像（arm64 原生） ---
          - os: macos-26
            platform: darwin/arm64
            artifact: wproxyman-macos-arm64
            asset: WProxyman_darwin_arm64.dmg
            isWindows: "false"

          # --- macOS amd64（Intel）：macos-26-intel（唯一免费 Intel 标准 runner） ---
          - os: macos-26-intel
            platform: darwin/amd64
            artifact: wproxyman-macos-amd64
            asset: WProxyman_darwin_amd64.dmg
            isWindows: "false"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # --- Windows：依次构建 amd64 与 arm64，并按平台命名 ---
      - name: Build Windows (amd64)
        if: matrix.isWindows == 'true'
        shell: pwsh
        run: |
          wails build -platform windows/amd64
          Move-Item build/bin/WProxyman.exe WProxyman_windows_amd64.exe -Force

      - name: Build Windows (arm64, cross-compiled)
        if: matrix.isWindows == 'true'
        shell: pwsh
        run: |
          Remove-Item build/bin/WProxyman.exe -ErrorAction SilentlyContinue
          wails build -platform windows/arm64
          Move-Item build/bin/WProxyman.exe WProxyman_windows_arm64.exe -Force

      # --- macOS：构建 .app，ad-hoc 签名后用 hdiutil 打成 dmg ---
      # 注意：ad-hoc 签名只能保证应用本地完整性；macOS Gatekeeper 仍会
      # 拦截未公证（notarized）的应用，首次打开请见 Release 说明。
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          wails build -platform ${{ matrix.platform }}
          codesign --force --deep --sign - build/bin/WProxyman.app
          # 组装 dmg 内容：.app + Applications 快捷方式（拖拽安装体验）
          DMG_STAGE="$(mktemp -d)"
          cp -R build/bin/WProxyman.app "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create \
            -volname WProxyman \
            -srcfolder "$DMG_STAGE" \
            -ov -format UDZO \
            "${{ matrix.asset }}"
          rm -rf "$DMG_STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.asset }}
          if-no-files-found: error

      # 打 tag（v*）时：构建产物同时直接发布为正式 Release。
      - name: Attach binaries to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}

  # ---------------------------------------------------------------------------
  # Linux 构建：编译原生二进制并上传，供 package-linux job 打包。
  # （独立 job：Wails 需在 Linux 原生环境编译 WebKitGTK 绑定。）
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux binary
        run: wails build -platform linux/amd64

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: wproxyman-linux-binary
          path: build/bin/WProxyman
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux 打包：拉取构建出的二进制，产出 .tar.gz / .deb / .rpm 三件套。
  # （Wails v2 不内置 Linux 打包，且 AppImage 依赖 FUSE 在部分发行版不可用，
  #  故改为覆盖全发行版的三种格式。）
  # ---------------------------------------------------------------------------
  package-linux:
    needs: build-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: wproxyman-linux-binary
          path: build/bin

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Package Linux (tar.gz / deb / rpm)
        shell: bash
        run: |
          # 版本号：tag（v*）用纯版本号，push main 用 dev 构建号。
          if [ "${{ startswith(github.ref, 'refs/tags/') }}" = "true" ]; then
            PKG_VER="${{ github.ref_name }}"
          else
            PKG_VER="0.0.0+dev.$(git rev-parse --short HEAD)"
          fi
          PKG_VER="${PKG_VER#v}"
          echo "packaging version: $PKG_VER"
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh build/bin/WProxyman "$PKG_VER" dist-linux
          ls -la dist-linux/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: wproxyman-linux-packages
          path: dist-linux/*
          if-no-files-found: error

      # 打 tag 时：直接把三件套附加到正式 Release。
      - name: Attach Linux packages to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-linux/*

  # ---------------------------------------------------------------------------
  # 自动发布：push 到 main 构建成功后，把全平台产物发布到 Releases 页面的
  # "Latest build"（预发布）。每次构建覆盖更新，无需手动打 tag。
  # ---------------------------------------------------------------------------
  publish:
    needs: [build, build-linux, package-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 全部产物收拢到一个目录（exe/dmg + Linux 三件套）。
      - name: Assemble release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      # 删除上一次的 "continuous" Release 与 tag，实现覆盖更新。
      - name: Clean up previous continuous release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = 'continuous';
            try {
              const rels = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
              for (const r of rels.data) {
                if (r.tag_name === tag) {
                  await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
                }
              }
            } catch (e) { console.log('clean release:', e.message); }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) { console.log('clean tag:', e.message); }

      # 发布最新的自动构建产物到 Releases 页面。
      - name: Publish to Releases (auto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Latest build
          body: |
            自动构建产物（main 分支最新提交，全平台）

            - Commit: `${{ github.sha }}`
            - 构建时间: ${{ github.event.head_commit.timestamp }}

            | 平台 | 架构 | 产物 |
            |---|---|---|
            | Windows | x64 | WProxyman_windows_amd64.exe |
            | Windows | ARM64 | WProxyman_windows_arm64.exe |
            | macOS | Apple Silicon | WProxyman_darwin_arm64.dmg |
            | macOS | Intel | WProxyman_darwin_amd64.dmg |
            | Linux | x64 | wproxyman_<ver>_linux_amd64.tar.gz / .deb / .rpm |

            > **macOS 首次打开说明**：应用未通过 Apple 公证（notarization），
            > macOS Gatekeeper 会提示"无法打开/无法验证开发者"。请任选其一：
            > 1. 右键（或按住 Control）点击 WProxyman.app → 选择「打开」；
            > 2. 终端执行：`xattr -d com.apple.quarantine /Applications/WProxyman.app`；
            > 3. 系统设置 → 隐私与安全性 → 「仍要打开」。
            > 正式无提示分发需配置 Apple Developer ID 证书 + 公证。

            > 正式版本请打 tag 发布：`git tag v1.0.0 && git push origin v1.0.0`
          files: release/*
          prerelease: true
