# ============================================================================
# WProxyman — build pipeline
#
# Builds the app on Windows / macOS (Intel + Apple Silicon) / Linux and
# uploads the binaries. On version tags (v*) the binaries are attached to a
# GitHub Release; on every push they are stored as workflow artifacts.
#
# The Go engine is pure Go, but Wails needs native system libraries, so each
# platform is built on its own native runner (cross-compiling is not
# supported by Wails).
# ============================================================================

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Release 上传需要写权限（softprops/action-gh-release）。
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: wproxyman-windows-amd64
          - os: macos-13
            platform: darwin/amd64
            artifact: wproxyman-macos-amd64
          - os: macos-14
            platform: darwin/arm64
            artifact: wproxyman-macos-arm64
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: wproxyman-linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (${{ matrix.platform }})
        run: wails build -platform ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*
          if-no-files-found: error

      - name: Attach binaries to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/*
