<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- 背景：深色对角渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262a34"/>
      <stop offset="1" stop-color="#0f1015"/>
    </linearGradient>
    <!-- 字标渐变：天蓝 → 蓝 → 紫 -->
    <linearGradient id="fg" x1="50" y1="80" x2="205" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- 链路连线渐变 -->
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- 节点光晕 -->
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景满幅方块（无圆角，填满整个画布；四角由 macOS 系统遮罩裁切） -->
  <rect x="0" y="0" width="256" height="256" fill="url(#bg)"/>
  <!-- 顶部内描边高光 -->
  <rect x="7" y="7" width="242" height="242" rx="51" fill="none" stroke="rgba(255,255,255,0.055)" stroke-width="2"/>

  <!-- W（三峰，渐变描边，内容整体居中） -->
  <path d="M 62 88 L 78 154 L 94 106 L 110 154 L 126 88"
        fill="none" stroke="url(#fg)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- P（竖线 + 顶部横线 + 右半圆） -->
  <path d="M 148 88 L 148 168 M 148 88 L 171 88 A 18 18 0 0 1 171 122 L 148 122"
        fill="none" stroke="url(#fg)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 数据链路：W 右峰 → 节点 → P 顶部（代理转发主题） -->
  <path d="M 130 88 L 148 88" stroke="url(#link)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <!-- 节点光晕 -->
  <circle cx="139" cy="88" r="22" fill="url(#glow)"/>
  <!-- 节点 -->
  <circle cx="139" cy="88" r="6.5" fill="#7dd3fc"/>
  <circle cx="139" cy="88" r="12" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.35"/>
</svg>
