<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- 背景：亮蓝对角渐变（亮色、蓝色调） -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <!-- 字标渐变：白 → 极浅蓝（亮底上保持清晰） -->
    <linearGradient id="fg" x1="50" y1="80" x2="205" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <!-- 链路连线渐变 -->
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <!-- 节点光晕 -->
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景圆角方块（内缩留边距，符合 macOS 图标规范：内容不贴画布边缘；
       mac/linux/win 通用圆角版，四角透明由各平台遮罩或素材本身处理） -->
  <rect x="15" y="15" width="226" height="226" rx="50" fill="url(#bg)"/>
  <!-- 顶部内描边高光 -->
  <rect x="22" y="22" width="212" height="212" rx="43" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="2"/>

  <!-- W（三峰，渐变描边，内容整体居中） -->
  <path d="M 62 88 L 78 154 L 94 106 L 110 154 L 126 88"
        fill="none" stroke="url(#fg)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- P（竖线 + 顶部横线 + 右半圆） -->
  <path d="M 148 88 L 148 168 M 148 88 L 171 88 A 18 18 0 0 1 171 122 L 148 122"
        fill="none" stroke="url(#fg)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 数据链路：W 右峰 → 节点 → P 顶部（代理转发主题） -->
  <path d="M 130 88 L 148 88" stroke="url(#link)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <!-- 节点光晕 -->
  <circle cx="139" cy="88" r="22" fill="url(#glow)"/>
  <!-- 节点 -->
  <circle cx="139" cy="88" r="6.5" fill="#ffffff"/>
  <circle cx="139" cy="88" r="12" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.35"/>
</svg>